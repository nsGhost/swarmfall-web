<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#140f33">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Armada Fall</title>
    <link rel="icon" href="TemplateData/icon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon.png">
    <style>
      html, body {
        margin: 0; height: 100%; background: #0a0820; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      /* Keep the game clear of notches and home indicators, as the prototype's #wrap does. */
      #wrap {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0a0820; touch-action: none; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #9a90c9; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; background: #140f33;
      }
      #loading h1 {
        margin: 0; font: 700 56px/0.92 system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffb347;
        transform: skew(-8deg); text-shadow: 3px 3px 0 #3fe0c5; text-align: center;
      }
      #bar { width: 200px; height: 6px; border-radius: 3px; background: rgba(154,144,201,.25); overflow: hidden; }
      #fill { width: 0; height: 100%; background: #ffb347; transition: width .2s; }
      #error { max-width: 300px; color: #ff8a5c; text-align: center; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <h1>Armada<br>Fall</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading…</div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/cbe742fd921160c64da12627521b9b1c.data.unityweb",
        frameworkUrl: buildUrl + "/0d31f98567939947a6c03a9d7c0c21c3.framework.js.unityweb",
        codeUrl: buildUrl + "/25f29f1c2aaa69baece1ffc419fb06dc.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HMVE Studios",
        productName: "Armada Fall",
        productVersion: "0.9.0",
        // Sharp on phones without rendering at 3x.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === 'error') document.querySelector("#error").textContent = msg; },
      };

      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // Match the game's first-run language choice: Spanish for Spanish browsers.
      if (/^es(-|$)/i.test(navigator.language || "")) {
        document.documentElement.lang = "es";
        document.querySelector("#status").textContent = "Cargando…";
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/24cbc17a2267578c8035d2b0c693330c.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").remove();
        }).catch(function (message) {
          document.querySelector("#status").textContent = "";
          document.querySelector("#error").textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
