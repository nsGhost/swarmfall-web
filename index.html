<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#140f33">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Armada Fall</title>
    <link rel="icon" href="TemplateData/icon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon.png">
    <style>
      html, body {
        margin: 0; height: 100%; background: #0a0820; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      /* Keep the game clear of notches and home indicators, as the prototype's #wrap does. */
      #wrap {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0a0820; touch-action: none; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #9a90c9; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #140f33 center / cover no-repeat;
      }
      /* With a splash picture behind: the title in the sky at the top, the bar at the foot. */
      #loading.art { justify-content: flex-start; color: #e8e4ff; text-shadow: 0 1px 4px #0a0820; }
      #loading.art h1 { margin-top: 11vh; text-shadow: 3px 3px 0 #3fe0c5, 0 0 22px rgba(10,8,32,.85); }
      #loading.art #bar { margin-top: auto; background: rgba(10,8,32,.55); }
      #loading.art #error { margin-bottom: 9vh; }
      /* A wide window shows the wide picture, which has less sky: a smaller title, nearer the top. */
      @media (orientation: landscape) { #loading.art h1 { margin-top: 3vh; font-size: 40px; } }
      #loading h1 {
        margin: 0; font: 700 56px/0.92 system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffb347;
        transform: skew(-8deg); text-shadow: 3px 3px 0 #3fe0c5; text-align: center;
      }
      #bar { width: 200px; height: 6px; border-radius: 3px; background: rgba(154,144,201,.25); overflow: hidden; }
      #fill { width: 0; height: 100%; background: #ffb347; transition: width .2s; }
      #error { max-width: 300px; color: #ff8a5c; text-align: center; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <h1>Armada<br>Fall</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading…</div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/2dee49b0202dc6b8f77bc7916c2e9507.data.unityweb",
        frameworkUrl: buildUrl + "/3825d1cdb696698491a782aa2ba35271.framework.js.unityweb",
        codeUrl: buildUrl + "/7fcd73be34c1d4776b84e87924835aee.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HMVE Studios",
        productName: "Armada Fall",
        productVersion: "0.9.0",
        // Sharp on phones without rendering at 3x.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === 'error') document.querySelector("#error").textContent = msg; },
      };

      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // One of the three splash pictures behind the loading bar, picked afresh each visit: upright on a phone, wide
      // in a wide window. They are rendered on the owner's machine and are not in git; a build without them keeps
      // the plain background.
      var art = new Image();
      art.onload = function () {
        var loading = document.querySelector("#loading");
        if (!loading) return;
        loading.style.backgroundImage = "url(" + art.src + ")";
        loading.classList.add("art");
      };
      art.src = "TemplateData/splash" + (1 + Math.floor(Math.random() * 3)) + (window.innerWidth > window.innerHeight ? "w" : "") + ".jpg";

      // Match the game's first-run language choice: Spanish for Spanish browsers.
      if (/^es(-|$)/i.test(navigator.language || "")) {
        document.documentElement.lang = "es";
        document.querySelector("#status").textContent = "Cargando…";
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/40120412f17506700629c373611b55e1.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          var loading = document.querySelector("#loading");
          if (!loading.classList.contains("art")) { loading.remove(); return; }
          // With a picture up, it stays over Unity's own short splash and then fades off the title screen, as the
          // game's opening picture does on a phone. A tap takes it away at once.
          document.querySelector("#bar").style.visibility = "hidden";
          document.querySelector("#status").textContent = "";
          var gone = false;
          function fade() {
            if (gone) return;
            gone = true;
            loading.style.transition = "opacity .4s";
            loading.style.opacity = 0;
            loading.style.pointerEvents = "none";
            setTimeout(function () { loading.remove(); }, 450);
          }
          loading.addEventListener("pointerdown", fade);
          setTimeout(fade, 2500);
        }).catch(function (message) {
          document.querySelector("#status").textContent = "";
          document.querySelector("#error").textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
